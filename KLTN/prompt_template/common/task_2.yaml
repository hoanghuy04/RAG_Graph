# ACADEMIC_PROMPT_TASK_2
# Nhiệm vụ 2 - Đặt câu hỏi thu thập metadata bắt buộc còn thiếu
description: "Nhiệm vụ 2: Thu thập metadata còn thiếu qua form — field KHÔNG lấy từ danh sách tĩnh như lisa-ai-agent (KLTN không thể áp cứng 1 danh sách field cố định vì mỗi chủ đề quy chế có thể phụ thuộc thuộc tính khác nhau). CalculationNode/AcademicComparisonNode có checklist field cố định riêng (Type A) và KHÔNG đi qua template này — chúng dùng AskUserClarificationNode riêng. Template này chỉ phục vụ Type B: field do chính LLM tự phát hiện tại NHIỆM VỤ 1 khi thấy văn bản chia nhánh theo thuộc tính sinh viên chưa xác định."
content: |
  ### NHIỆM VỤ 2: THU THẬP THUỘC TÍNH CÒN THIẾU

  **CHỈ CHẠY KHI NHIỆM VỤ 1 ĐÃ CHỌN "CÁCH 2 — HỎI LẠI".** Nếu NHIỆM VỤ 1 chọn CÁCH 1 (bảng so sánh đầy đủ các nhánh) thì bạn ĐÃ trả lời xong — bỏ qua toàn bộ nhiệm vụ này, KHÔNG đặt câu hỏi, KHÔNG sinh JSON `ask_user_form`; hỏi lại sau khi đã liệt kê đủ các nhánh là thừa và gây khó chịu. Nếu vừa không chọn CÁCH 2 vừa có `<missing_metadata_to_confirm>` là "Không có" → TUYỆT ĐỐI không có câu nào kết thúc bằng dấu "?".

  Hai nguồn field cần hỏi — xử lý CHỈ một trong hai theo đúng thứ tự ưu tiên:
  1. **Field đã hỏi ở lượt TRƯỚC nhưng chưa giải quyết** — khi `<missing_metadata_to_confirm>` KHÁC "Không có", nghĩa là lượt trước bạn đã hỏi nhưng người dùng trả lời không khớp nhánh nào: dùng LẠI ĐÚNG tên `field` và tập `options` đó, KHÔNG tự đổi tên dù nghĩ ra cách diễn đạt hay hơn — đổi tên làm mất liên kết với form đã hiển thị và reset bộ đếm số lần hỏi lại, khiến người dùng kẹt trong vòng hỏi không kết thúc. (Field đã trả lời rõ không còn xuất hiện ở đây mà nằm trong `<student_declared_attributes>` — coi như xong, không hỏi lại.)
  2. **Field bạn tự phát hiện MỚI ở NHIỆM VỤ 1 lượt này** (rule "PHÁT HIỆN NHÁNH PHỤ THUỘC THUỘC TÍNH SINH VIÊN") — khi `<missing_metadata_to_confirm>` là "Không có" nhưng đối chiếu văn bản thấy câu trả lời phụ thuộc thuộc tính chưa xác định ở CẢ BA nguồn: tự đặt `field` (tên ngắn gọn không dấu) và lấy `options` (nếu có) NGUYÊN VĂN từ nhãn nhánh trong văn bản.

  <missing_metadata_to_confirm>
  {missing_metadata_to_confirm}
  </missing_metadata_to_confirm>

  Khối trên KHÔNG chứa định nghĩa field — định nghĩa nằm ở nhãn nhánh trong `<academic_context>`. Đọc lại ở đó để diễn đạt câu hỏi tự nhiên hơn lượt trước nếu cần, miễn giữ NGUYÊN tên `field` và tập `options`.

  Lưu ý:
  - **GOM FIELD VÀO CÙNG MỘT FORM**: đưa TẤT CẢ thuộc tính ĐỘC LẬP đang chặn câu trả lời vào một form duy nhất — người chưa đăng nhập hoặc hồ sơ trống thường thiếu 3–4 thuộc tính cùng lúc (hệ đào tạo, khóa, chương trình, điểm rèn luyện), hỏi lẻ bắt họ đi nhiều vòng thì phần lớn bỏ giữa chừng. CHỈ tách sang lượt sau khi thuộc tính LỒNG NHAU: giá trị field B chỉ có nghĩa sau khi biết A (VD: `loai_hinh_clc` chỉ tồn tại nếu `he_dao_tao = chinh_quy_clc`) → hỏi A trước. Chỉ đưa vào form thuộc tính THỰC SỰ chặn câu trả lời; hỏi thêm "cho đầy đủ hồ sơ" là hỏi thừa.
  - **DUY NHẤT 01 CÂU HỎI, Ở CUỐI**: dù form có nhiều field, toàn bộ phản hồi chỉ được có đúng 1 câu dẫn vào form, nằm cuối cùng ngay trước JSON; phần tư vấn phía trên TUYỆT ĐỐI không chứa câu hỏi hay câu dẫn dắt nào khác. Câu đó phải hoàn chỉnh và kết thúc bằng `?`:
    + ĐÚNG: "Bạn đang học theo hệ đào tạo nào ạ?" / "Bạn cho mình biết thêm vài thông tin sau để tra đúng quy định nhé?"
    + SAI: "Bạn vui lòng điền các thông tin dưới đây:" (kết thúc bằng `:`).
  - **TRẢ LỜI TRƯỚC PHẦN KHÔNG PHỤ THUỘC THUỘC TÍNH NÀO**: điều kiện chung áp dụng cho mọi nhánh phải nêu ngay trong lượt này, không giữ lại chờ người dùng điền form.
  - KHÔNG hứa trước số lượng câu hỏi kiểu "mình sẽ cần hỏi thêm vài thông tin nữa" — sau khi người dùng điền form, truy vấn được thu hẹp và thuộc tính tưởng còn thiếu có thể đã không cần nữa.
  - KHÔNG tự suy hoặc tự chốt field cần hỏi từ tiêu đề môn học, mã ngành, ví dụ hay nhánh không liên quan trong tài liệu.
  - Xưng hô nhất quán với văn phong toàn phản hồi (VD: "Bạn/Sinh viên...").

  {ask_user_form_guide}
