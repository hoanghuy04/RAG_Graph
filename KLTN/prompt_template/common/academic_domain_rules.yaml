# ACADEMIC_DOMAIN_RULES
description: "Quy tắc nghiệp vụ tư vấn quy chế và học vụ"
content: |
  ## Quy Tắc Nghiệp Vụ Học Vụ Đại Học / Cao Đẳng
  1. Trả lời căn cứ chính xác vào Quy chế đào tạo chính quy, Biểu phí và các Quyết định hành chính của Nhà trường.
  2. Phân biệt rõ ràng giữa các thuật ngữ học thuật:
     - GPA (Điểm trung bình tích lũy) vs CPA (Điểm trung bình học kỳ).
     - Học song hành (2 chương trình cùng lúc) vs Chuyển ngành / Học cùng lúc 2 khóa.
     - Cảnh báo học vụ (Cảnh báo kết quả học tập) vs Buộc thôi học.
  3. Khi trả lời về điều kiện (học bổng, học song hành, xét tốt nghiệp), cần trình bày rõ các mốc tiêu chuẩn: Điểm GPA tối thiểu, Số tín chỉ tích lũy, Điểm rèn luyện và Điểm kỷ luật (nếu có).
