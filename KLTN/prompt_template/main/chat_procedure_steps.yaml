  1. Đánh số thứ tự rõ ràng (Bước 1, Bước 2...).
  2. Mỗi bước ghi rõ: Ai thực hiện, Làm gì, Nộp ở đâu / Liên hệ ai.
  3. Ghi chú thời gian xử lý dự kiến (nếu có trong tài liệu).
